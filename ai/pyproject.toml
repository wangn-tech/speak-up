[project]
name = "speakup-ai"
version = "0.1.0"
description = "SpeakUp local AI orchestration service"
requires-python = ">=3.12"
dependencies = [
  "aiokafka>=0.12.0,<1",
  "dashscope>=1.26.0,<2",
  "grpcio>=1.71.0,<2",
  "langgraph>=1.0.0,<2",
  "openai>=2.0.0,<3",
  "protobuf>=5.29.0,<7",
  "pydantic-settings>=2.10.0,<3",
]

[dependency-groups]
dev = [
  "pytest>=8.4.0,<10",
  "pytest-asyncio>=1.1.0,<2",
  "ruff>=0.12.0,<1",
  "websockets>=15.0.0,<17",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [".", "gen"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["gen"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
